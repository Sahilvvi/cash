<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashback - India's Top Cashback & Coupons Site</title>
    <meta name="description" content="Save money on every online purchase with Cashback. Get the best deals, coupons, and cashback offers from 300+ top stores in India." />
    <meta name="author" content="Cashback" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cashback.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Cashback - India's Top Cashback & Coupons Site" />
    <meta property="og:description" content="Save money on every online purchase with Cashback. Get the best deals, coupons, and cashback offers from 300+ top stores in India." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cashback.com/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Cashback" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CashbackIndia" />
    <meta name="twitter:title" content="Cashback - India's Top Cashback & Coupons Site" />
    <meta name="twitter:description" content="Save money on every online purchase with Cashback." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F37022" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cashback" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cashback",
      "url": "https://cashback.com/",
      "description": "India's Top Cashback & Coupons Site. Save money on every online purchase.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cashback.com/stores?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
